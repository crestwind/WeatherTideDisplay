<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather &amp; Tides</title>
<style>
  :root {
    --fg: #fff;
    --dim: rgba(255,255,255,.72);
    --faint: rgba(255,255,255,.45);
    --card: rgba(6,12,22,.30);
    --line: rgba(255,255,255,.15);
    --water: #8fd3ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* Everything is sized in rem, and rem follows screen height, so it scales from 720p to 4K. */
  html { font-size: 1.85vh; background: #0b1a3a; }
  body {
    height: 100vh; overflow: hidden; color: var(--fg); background: #0b1a3a;
    font-family: "Segoe UI", "Inter", "Helvetica Neue", Ubuntu, Roboto, "Noto Sans", Arial, sans-serif;
    -webkit-font-smoothing: antialiased; user-select: none;
  }
  body.idle { cursor: none; }

  .bg { position: fixed; inset: 0; opacity: 0; transition: opacity 4s ease; }
  .bg.on { opacity: 1; }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; }
  #glass { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
  #shade {
    position: fixed; inset: 0; pointer-events: none;
    background:
      linear-gradient(90deg, rgba(0,0,0,.22), rgba(0,0,0,0) 45%),
      radial-gradient(ellipse at 50% 35%, rgba(0,0,0,0) 55%, rgba(0,0,0,.32) 100%);
  }

  #app {
    position: fixed; inset: 0; padding: 3.4vh 3.4vw;
    display: grid; grid-template-columns: 1fr 1.25fr; gap: 2.6vw;
    transition: transform 3s ease; text-shadow: 0 1px 12px rgba(0,0,0,.25);
  }

  /* ---------- left column ---------- */
  .left { display: flex; flex-direction: column; min-height: 0; }
  .clock { font-size: 5rem; font-weight: 300; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .clock small { font-size: 1.8rem; font-weight: 400; margin-left: .4rem; color: var(--dim); }
  .date { font-size: 1.45rem; color: var(--dim); margin-top: .5rem; }
  .spacer { flex: 1; }

  /* weather alert notice beside the clock */
  .top { display: flex; align-items: center; gap: 1.6rem; }
  .alert {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 1rem; padding: .9rem 1.2rem;
    border-radius: 1.2rem; border: 2px solid; text-shadow: 0 1px 4px rgba(0,0,0,.3);
  }
  .alert[hidden] { display: none; }
  .alert.warning { background: rgba(196,28,40,.88); border-color: #ff7070; animation: alertGlow 2.4s ease-in-out infinite; }
  .alert.watch { background: rgba(206,104,16,.88); border-color: #ffb057; }
  .alert.advisory { background: rgba(176,136,10,.88); border-color: #ffd95a; }
  .alert svg { width: 3.2rem; height: 3.2rem; flex: none; }
  .alert .ev { font-size: 1.75rem; font-weight: 700; line-height: 1.1; }
  .alert .when { font-size: 1.05rem; margin-top: .3rem; opacity: .92; }
  .alert .cnt { font-size: .85rem; margin-top: .2rem; opacity: .75; text-transform: uppercase; letter-spacing: .06em; }
  @keyframes alertGlow { 50% { box-shadow: 0 0 2.4rem rgba(255,70,70,.6); } }
  .soe {
    display: flex; align-items: center; gap: .6rem; margin-top: 1rem; padding: .55rem 1rem; font-size: 1.15rem;
    background: rgba(120,20,40,.88); border: 1px solid #ff8a9a; border-radius: .8rem; text-shadow: none;
  }
  .soe[hidden] { display: none; }
  .soe svg { width: 1.4rem; height: 1.4rem; flex: none; }
  .soe b { text-transform: uppercase; letter-spacing: .06em; }

  .logbox { margin: .2rem 0 1rem; border: 1px solid rgba(255,255,255,.22); border-radius: .6rem; padding: .6rem .8rem; }
  .logbox summary { cursor: pointer; font-size: 1rem; color: var(--dim); }
  #logList { max-height: 15rem; overflow: auto; margin-top: .7rem; display: flex; flex-direction: column; gap: .55rem; }
  .logrow { display: grid; grid-template-columns: .7rem 1fr; gap: .6rem; font-size: .98rem; }
  .logrow i { width: .6rem; height: .6rem; border-radius: 50%; margin-top: .4rem; background: #8fd3ff; }
  .logrow i.warning { background: #ff5a5a; } .logrow i.watch { background: #ffa040; }
  .logrow i.advisory { background: #ffd34d; } .logrow i.emergency { background: #d48bff; }
  #logList .m { color: var(--faint); font-size: .84rem; }
  .place { font-size: 2rem; font-weight: 600; }
  .status { font-size: .95rem; color: var(--faint); margin-top: .25rem; }
  .status.warn { color: #ffcf7a; }
  .temp { font-size: 10.5rem; font-weight: 200; line-height: 1; letter-spacing: -.05em; margin: .4rem 0 0 -.4rem; }
  .cond { font-size: 2rem; font-weight: 500; display: flex; align-items: center; gap: .5rem; }
  .cond .ic { width: 3rem; height: 3rem; margin: 0; }
  .hl { font-size: 1.45rem; color: var(--dim); margin-top: .35rem; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: .8rem; margin-top: 1.8rem; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 1rem; padding: .7rem .9rem; min-width: 0; }
  .tile .k { font-size: .78rem; text-transform: uppercase; letter-spacing: .09em; color: var(--dim); white-space: nowrap; }
  .tile .v { font-size: 1.5rem; font-weight: 500; margin-top: .2rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .s { font-size: .82rem; color: var(--faint); margin-top: .1rem; white-space: nowrap; }
  .arrow { display: inline-block; font-weight: 700; }

  /* ---------- right column ---------- */
  .right { display: grid; grid-template-rows: auto 1fr auto; gap: 1.1rem; min-height: 0; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 1.4rem;
    padding: .85rem 1.3rem; min-height: 0; display: flex; flex-direction: column;
  }
  .card h3 {
    font-size: .85rem; text-transform: uppercase; letter-spacing: .1em; color: var(--dim); font-weight: 600;
    padding-bottom: .55rem; margin-bottom: .6rem; border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; gap: 1rem;
  }
  .card h3 span { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .ic { width: 2.3rem; height: 2.3rem; display: block; margin: .2rem auto; overflow: visible; }

  .hours { display: grid; grid-template-columns: repeat(12, 1fr); text-align: center; }
  .hours .t { font-size: 1rem; font-weight: 500; }
  .hours .p { font-size: .8rem; color: var(--water); height: 1rem; font-weight: 600; }
  .hours .d { font-size: 1.35rem; font-weight: 500; }
  .hours .a { font-size: .78rem; color: var(--water); height: 1rem; margin-top: .1rem; font-weight: 600; }

  .days { display: flex; flex-direction: column; }
  .day {
    display: grid; grid-template-columns: 5rem 2.6rem 5rem 3.2rem 1fr 3.2rem; align-items: center;
    gap: .6rem; height: 2.05rem; font-size: 1.25rem; border-top: 1px solid rgba(255,255,255,.07);
  }
  .day:first-child { border-top: 0; }
  .day .ic { width: 1.8rem; height: 1.8rem; margin: 0; }
  .day .p { font-size: .85rem; color: var(--water); font-weight: 600; line-height: 1.05; }
  .day .p small { display: block; font-size: .78rem; font-weight: 500; white-space: nowrap; }
  .sn { color: #fff; white-space: nowrap; }
  .fl { width: .8em; height: .8em; vertical-align: -.08em; margin-left: .12em; }
  .day .lo { color: var(--dim); text-align: right; }
  .bar { position: relative; height: .42rem; border-radius: 1rem; background: rgba(255,255,255,.14); }
  .bar i { position: absolute; top: 0; bottom: 0; border-radius: 1rem; }
  .bar b { position: absolute; top: 50%; width: .62rem; height: .62rem; margin: -.31rem 0 0 -.31rem; border-radius: 50%; background: #fff; box-shadow: 0 0 0 .14rem rgba(0,0,0,.35); }

  .tide-sum { font-size: 1.25rem; }
  .tide-sum b { font-weight: 600; }
  .tide-sum .dim { color: var(--dim); }
  .chart { flex: 1; min-height: 8rem; position: relative; margin: .4rem 0; }
  .chart svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .tide-marks { position: relative; height: 3.8rem; }
  .tide-marks .mk { position: absolute; top: .1rem; transform: translateX(-50%); text-align: center; white-space: nowrap; font-size: .9rem; line-height: 1.2; color: var(--dim); }
  .tide-marks .mk strong { display: block; font-size: 1.2rem; color: var(--fg); font-weight: 500; }
  .tide-marks .mk.past { opacity: .45; }
  .empty { margin: auto; color: var(--dim); font-size: 1.15rem; text-align: center; max-width: 26rem; line-height: 1.4; }

  /* ---------- settings ---------- */
  #gear, #fsBtn {
    position: fixed; right: 1.2rem; bottom: 1.2rem; width: 3rem; height: 3rem; border-radius: 50%; z-index: 6;
    border: 1px solid var(--line); background: var(--card); color: #fff; cursor: pointer; transition: opacity .6s;
    display: grid; place-items: center;
  }
  #fsBtn { right: 4.8rem; }
  #gear svg, #fsBtn svg { width: 1.5rem; height: 1.5rem; }
  body.idle #gear, body.idle #fsBtn { opacity: 0; }
  .buttons .left { margin-right: auto; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; z-index: 10; }
  .modal[hidden] { display: none; }
  .panel {
    width: min(46rem, 92vw); max-height: 92vh; overflow: auto; background: #141c28; border: 1px solid var(--line);
    border-radius: 1.4rem; padding: 1.8rem 2rem; box-shadow: 0 2rem 4rem rgba(0,0,0,.5); text-shadow: none;
  }
  .panel h2 { font-size: 1.7rem; font-weight: 600; margin-bottom: 1.2rem; }
  .panel label { display: block; font-size: .95rem; color: var(--dim); margin-bottom: 1rem; }
  .panel input, .panel select {
    display: block; width: 100%; margin-top: .35rem; font: inherit; font-size: 1.15rem; color: #fff;
    background: #0c121b; border: 1px solid rgba(255,255,255,.22); border-radius: .6rem; padding: .55rem .75rem;
  }
  .panel input:focus, .panel select:focus, .panel button:focus { outline: 2px solid var(--water); outline-offset: 2px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  #locResults { margin: -.4rem 0 1rem; display: flex; flex-direction: column; gap: .3rem; }
  #locResults button {
    text-align: left; font: inherit; font-size: 1.05rem; color: #fff; background: rgba(255,255,255,.06);
    border: 1px solid transparent; border-radius: .5rem; padding: .45rem .7rem; cursor: pointer;
  }
  #locResults button:hover { background: rgba(255,255,255,.12); }
  #locResults .msg { font-size: .95rem; color: var(--dim); }
  #locResults .picked { color: #9be7a8; font-size: 1.05rem; }
  .buttons { display: flex; justify-content: flex-end; gap: .8rem; margin-top: .6rem; }
  .buttons button {
    font: inherit; font-size: 1.1rem; padding: .55rem 1.4rem; border-radius: .6rem; cursor: pointer;
    border: 1px solid rgba(255,255,255,.22); background: transparent; color: #fff;
  }
  .buttons button[type=submit] { background: #2f7fd6; border-color: #2f7fd6; font-weight: 600; }
  .hint { margin-top: 1rem; font-size: .85rem; color: var(--faint); }
  #toast {
    position: fixed; left: 50%; bottom: 2rem; transform: translateX(-50%); background: #141c28; border: 1px solid var(--line);
    padding: .6rem 1.2rem; border-radius: .8rem; font-size: 1.05rem; opacity: 0; transition: opacity .3s; z-index: 20; pointer-events: none;
  }
  #toast.on { opacity: 1; }
</style>
</head>
<body>
<div class="bg" id="bgA"></div>
<div class="bg" id="bgB"></div>
<canvas id="sky"></canvas>
<div id="shade"></div>

<main id="app">
  <section class="left">
    <div class="top">
      <div><div class="clock" id="clock">--:--</div><div class="date" id="date"></div></div>
      <div class="alert" id="alert" hidden></div>
    </div>
    <div class="soe" id="soe" hidden></div>
    <div class="spacer"></div>
    <div class="place" id="place">Weather &amp; Tides</div>
    <div class="status" id="status">Loading…</div>
    <div class="temp" id="temp">--°</div>
    <div class="cond" id="cond"></div>
    <div class="hl" id="hl"></div>
    <div class="stats" id="stats"></div>
  </section>

  <section class="right">
    <div class="card"><h3>Hourly forecast</h3><div class="hours" id="hours"></div></div>
    <div class="card" id="tideCard"><h3>Tides <span id="tideSrc"></span></h3><div id="tideBody" style="display:flex;flex-direction:column;flex:1;min-height:0"></div></div>
    <div class="card"><h3>7-day forecast</h3><div class="days" id="days"></div></div>
  </section>
</main>

<canvas id="glass"></canvas>

<button id="fsBtn" aria-label="Full screen" title="Full screen (F)"></button>
<button id="gear" aria-label="Settings" title="Settings (S)">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
</button>

<div class="modal" id="settings" hidden>
  <form class="panel" id="setForm" autocomplete="off">
    <h2>Settings</h2>
    <label>Location
      <input id="locInput" placeholder="City or town, ZIP code, or lat,lon">
    </label>
    <div id="locResults"></div>
    <div class="row">
      <label>Units
        <select id="unitsSel"><option value="imperial">°F · mph · ft</option><option value="metric">°C · km/h · m</option></select>
      </label>
      <label>Clock
        <select id="clockSel"><option value="12">12-hour</option><option value="24">24-hour</option></select>
      </label>
    </div>
    <div class="row">
      <label>Tide station (NOAA ID, blank = nearest)
        <input id="stationInput" placeholder="auto">
      </label>
      <label>Background animation
        <select id="motionSel"><option value="full">Full (30 fps)</option><option value="light">Light (15 fps, fewer particles)</option><option value="off">Off (still image)</option></select>
      </label>
    </div>
    <div class="row">
      <label>Background scene
        <select id="sceneSel">
          <option value="auto">Match current weather</option>
          <option value="clear">Preview: clear</option><option value="partly">Preview: partly cloudy</option>
          <option value="cloudy">Preview: cloudy</option><option value="fog">Preview: fog</option>
          <option value="drizzle">Preview: drizzle</option><option value="rain">Preview: rain</option>
          <option value="heavy">Preview: heavy rain</option><option value="flurries">Preview: flurries</option>
          <option value="snow">Preview: snow</option><option value="heavysnow">Preview: heavy snow</option>
          <option value="storm">Preview: thunderstorm</option><option value="hurricane">Preview: hurricane</option>
          <option value="windy">Preview: high wind</option>
        </select>
      </label>
      <label>Time of day
        <select id="todSel"><option value="auto">Match the sun</option><option value="day">Preview: day</option><option value="golden">Preview: sunrise / sunset</option><option value="night">Preview: night</option></select>
      </label>
    </div>
    <div class="row">
      <label>Test alert notice
        <select id="alertSel">
          <option value="">Off (real alerts only)</option>
          <option value="demo">Mix: flood warning, advisory &amp; earthquake</option>
          <option>Hurricane Warning</option><option>Tropical Storm Warning</option><option>Tornado Warning</option>
          <option>Severe Thunderstorm Warning</option><option>Flash Flood Warning</option><option>Flood Watch</option>
          <option>Coastal Flood Warning</option><option>Coastal Flood Advisory</option><option>Winter Storm Warning</option>
          <option>High Wind Warning</option><option>Tsunami Warning</option><option value="earthquake">Earthquake (M6.2)</option>
        </select>
      </label>
      <label>Test state of emergency
        <select id="soeSel"><option value="">Off</option><option value="nj">New Jersey state declaration</option><option value="on">Federal (FEMA) declaration</option></select>
      </label>
    </div>
    <details class="logbox">
      <summary>Alert history, last 30 days <span id="logCount"></span></summary>
      <div id="logList"></div>
    </details>
    <div class="buttons"><button type="button" class="left" id="fsSetBtn">Full screen</button><button type="button" id="cancelBtn">Cancel</button><button type="submit">Save</button></div>
    <p class="hint">Keys: S or Enter opens settings · Esc closes · R refreshes · F toggles full screen.</p>
    <p class="hint" id="verLine"></p>
  </form>
</div>
<div id="toast"></div>

<!-- version.js is written by make-flashdrive.bat; it's missing on the development copy -->
<script src="version.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const rnd = (a, b) => a + Math.random() * (b - a);

/* ======================= settings ======================= */
const DEFAULTS = { name: '', lat: null, lon: null, units: 'imperial', clock: '12', tideStation: '', motion: 'full', scene: 'auto', tod: 'auto', alertPreview: '', soePreview: '' };
let S = loadSettings();
function loadSettings() {
  let s = { ...DEFAULTS };
  try { s = { ...s, ...JSON.parse(localStorage.getItem('wt-settings') || '{}') }; } catch (e) {}
  // URL parameters win, e.g. index.html?lat=38.93&lon=-74.91&name=Cape%20May
  const q = new URLSearchParams(location.search);
  if (q.has('lat') && q.has('lon')) { s.lat = +q.get('lat'); s.lon = +q.get('lon'); s.name = q.get('name') || s.name || `${s.lat}, ${s.lon}`; }
  for (const k of ['units', 'scene', 'tod', 'motion']) if (q.has(k)) s[k] = q.get(k);
  // ?alert=demo or ?alert=<alert name> just pre-fills the test options; settings take over from there
  if (q.has('alert')) { s.alertPreview = q.get('alert'); if (s.alertPreview === 'demo') s.soePreview = 'on'; }
  return s;
}
function saveSettings() { try { localStorage.setItem('wt-settings', JSON.stringify(S)); } catch (e) {} }

/* ======================= data ======================= */
let W = null;    // Open-Meteo forecast
let M = null;    // Open-Meteo marine (waves, water temp, model sea level)
let T = null;    // tides: { source, ext: [{t, v, type}], pts: [{t, v}] }
let tideMsg = 'Loading tides…';
let lastOk = 0, failed = false, retryT = 0;

const imp = () => S.units === 'imperial';
const tz = () => (W && W.timezone) || undefined;

async function getJSON(url) {
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error(`HTTP ${r.status} for ${url}`);
  return r.json();
}
const qs = o => new URLSearchParams(o).toString();

async function loadWeather() {
  return getJSON('https://api.open-meteo.com/v1/forecast?' + qs({
    latitude: S.lat, longitude: S.lon, timezone: 'auto', timeformat: 'unixtime', forecast_days: 7,
    current: 'temperature_2m,apparent_temperature,relative_humidity_2m,is_day,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m,pressure_msl',
    hourly: 'temperature_2m,weather_code,precipitation_probability,rain,showers,snowfall,is_day',
    daily: 'weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max,precipitation_probability_max,rain_sum,showers_sum,snowfall_sum',
    temperature_unit: imp() ? 'fahrenheit' : 'celsius', wind_speed_unit: imp() ? 'mph' : 'kmh', precipitation_unit: imp() ? 'inch' : 'mm',
  }));
}

async function loadMarine() {
  const j = await getJSON('https://marine-api.open-meteo.com/v1/marine?' + qs({
    latitude: S.lat, longitude: S.lon, timezone: 'auto', timeformat: 'unixtime', past_days: 1, forecast_days: 3,
    hourly: 'sea_level_height_msl,wave_height,sea_surface_temperature',
  }));
  return j.hourly && j.hourly.time ? j : null;
}

// NOAA tide stations (US coasts, Alaska, Hawaii, territories). List is cached for 30 days.
async function noaaStations() {
  try {
    const c = JSON.parse(localStorage.getItem('wt-noaa') || 'null');
    if (c && Date.now() - c.t < 30 * 864e5) return c.s;
  } catch (e) {}
  const j = await getJSON('https://api.tidesandcurrents.noaa.gov/mdapi/prod/webapi/stations.json?type=tidepredictions');
  const s = j.stations.map(x => [x.id, x.name + (x.state ? ', ' + x.state : ''), +x.lat, +x.lng]);
  try { localStorage.setItem('wt-noaa', JSON.stringify({ t: Date.now(), s })); } catch (e) {}
  return s;
}
function distKm(a, b, c, d) {
  const r = Math.PI / 180, x = Math.sin((c - a) * r / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin((d - b) * r / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(x));
}

async function loadTides() {
  let station = null;
  const inNoaaArea = S.lat > -20 && (S.lon < -60 || S.lon > 130);
  if (S.tideStation || inNoaaArea) {
    const list = await noaaStations().catch(() => []);
    if (S.tideStation) {
      const f = list.find(s => s[0] === S.tideStation);
      station = { id: S.tideStation, name: f ? f[1] : 'Station ' + S.tideStation, km: f ? distKm(S.lat, S.lon, f[2], f[3]) : null };
    } else {
      let best = null, bd = Infinity;
      for (const s of list) { const d = distKm(S.lat, S.lon, s[2], s[3]); if (d < bd) { bd = d; best = s; } }
      if (best && bd <= 60) station = { id: best[0], name: best[1], km: bd };
    }
  }
  if (station) {
    try { return await loadNoaa(station); } catch (e) { console.warn('NOAA failed, falling back to model', e); }
  }
  tideMsg = 'No tide data for this location.<br>Tides appear for coastal locations.';
  return M ? tideFromMarine(M) : null;
}

async function loadNoaa(st) {
  const d = new Date(Date.now() - 864e5);
  const ymd = '' + d.getUTCFullYear() + String(d.getUTCMonth() + 1).padStart(2, '0') + String(d.getUTCDate()).padStart(2, '0');
  const j = await getJSON('https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?' + qs({
    product: 'predictions', interval: 'hilo', datum: 'MLLW', station: st.id, begin_date: ymd, range: 96,
    units: imp() ? 'english' : 'metric', time_zone: 'gmt', format: 'json', application: 'weather_tide_display',
  }));
  if (!j.predictions || !j.predictions.length) throw new Error((j.error && j.error.message) || 'no predictions');
  const ext = j.predictions.map(p => ({ t: Date.parse(p.t.replace(' ', 'T') + ':00Z'), v: +p.v, type: p.type === 'H' ? 'high' : 'low' }));
  // NOAA gives highs/lows; fill the curve between them with the standard cosine tide shape.
  const pts = [];
  for (let i = 0; i < ext.length - 1; i++) {
    const a = ext[i], b = ext[i + 1];
    for (let t = a.t; t < b.t; t += 15 * 60e3) pts.push({ t, v: a.v + (b.v - a.v) * (1 - Math.cos(Math.PI * (t - a.t) / (b.t - a.t))) / 2 });
  }
  pts.push(ext[ext.length - 1]);
  const dist = st.km == null ? '' : ` (${Math.round(imp() ? st.km / 1.609 : st.km)} ${imp() ? 'mi' : 'km'})`;
  return { source: 'NOAA · ' + st.name + dist, ext, pts };
}

function tideFromMarine(m) {
  const h = m.hourly, f = imp() ? 3.28084 : 1;
  const pts = h.time.map((t, i) => ({ t: t * 1000, v: h.sea_level_height_msl[i] })).filter(p => p.v != null).map(p => ({ t: p.t, v: p.v * f }));
  if (pts.length < 12) return null;
  const ext = [];
  for (let i = 1; i < pts.length - 1; i++) {
    const a = pts[i - 1].v, b = pts[i].v, c = pts[i + 1].v;
    const hi = b > a && b >= c, lo = b < a && b <= c;
    if (!hi && !lo) continue;
    const den = a - 2 * b + c, off = den ? (a - c) / (2 * den) : 0;   // parabolic refinement between hourly samples
    ext.push({ t: pts[i].t + off * 3600e3, v: b - (a - c) * off / 4, type: hi ? 'high' : 'low' });
  }
  return { source: 'Open-Meteo ocean model (approximate)', ext, pts };
}

async function refreshWeather() {

/* ---------- alerts: weather (NWS), earthquakes (USGS), emergency declarations (FEMA) ---------- */
// Weather alerts from the US National Weather Service (US locations only).
// Shown: warnings, watches, emergencies, and anything about flooding (incl. coastal/tidal flood advisories).
let alerts = [], quakes = [], decls = [], county = null, alertIdx = 0;
const LEVEL = { warning: 0, watch: 1, advisory: 2 }, SEV = { Extreme: 0, Severe: 1, Moderate: 2, Minor: 3 };
async function loadAlerts() {
  const j = await getJSON(`https://api.weather.gov/alerts/active?point=${(+S.lat).toFixed(4)},${(+S.lon).toFixed(4)}`);
  const byEvent = {};
  for (const f of j.features || []) {
    const p = f.properties;
    if (p.status !== 'Actual' || p.messageType === 'Cancel') continue;
    if (!/Warning|Watch|Emergency|Flood/.test(p.event) || /Small Craft|Marine|Gale|Seas/.test(p.event)) continue;
    const start = p.onset || p.effective;
    const a = { key: `nws|${p.event}|${start}`, event: p.event, sev: p.severity, start: Date.parse(start), ends: Date.parse(p.ends || p.expires),
      level: /Warning|Emergency/.test(p.event) ? 'warning' : /Watch/.test(p.event) ? 'watch' : 'advisory' };
    if (!byEvent[a.event] || a.ends > byEvent[a.event].ends) byEvent[a.event] = a;   // one entry per alert type
  }
  return Object.values(byEvent).sort((a, b) => LEVEL[a.level] - LEVEL[b.level] || (SEV[a.sev] ?? 4) - (SEV[b.sev] ?? 4));
}

// Earthquakes (USGS, worldwide): recent quakes strong enough and close enough to matter here.
// These are reports of quakes that already happened, not early warnings.
async function loadQuakes() {
  const j = await getJSON('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/2.5_day.geojson');
  const now = Date.now();
  return (j.features || []).map(f => {
    const [lon, lat] = f.geometry.coordinates;
    return { key: 'eq|' + f.id, mag: f.properties.mag, km: distKm(S.lat, S.lon, lat, lon), start: f.properties.time };
  }).filter(q => now - q.start < 6 * 3600e3 && ((q.mag >= 3.5 && q.km <= 150) || (q.mag >= 5 && q.km <= 500) || (q.mag >= 6.5 && q.km <= 1500)))
    .sort((a, b) => b.mag - a.mag)
    .map(q => ({ ...q, quake: true, event: `M${q.mag.toFixed(1)} Earthquake`, ends: q.start + 6 * 3600e3,
      level: q.mag >= 6 ? 'warning' : q.mag >= 5 ? 'watch' : 'advisory' }));
}

// Emergency declarations (FEMA) covering this county or the whole state. Federal declarations are made at a
// governor's request, so they follow state emergencies; governor-only declarations have no public data feed.
async function loadDeclarations() {
  if (!county) {
    const p = await getJSON(`https://api.weather.gov/points/${(+S.lat).toFixed(4)},${(+S.lon).toFixed(4)}`);
    const m = /([A-Z]{2})C(\d{3})$/.exec(p.properties.county || '');
    if (!m) return [];
    county = { state: m[1], fips: m[2] };
  }
  const since = new Date(Date.now() - 180 * 864e5).toISOString();
  const j = await getJSON('https://www.fema.gov/api/open/v2/DisasterDeclarationsSummaries?' + qs({
    $filter: `state eq '${county.state}' and declarationDate ge '${since}'`, $orderby: 'declarationDate desc', $top: 500 }));
  const seen = {}, now = Date.now();
  return (j.DisasterDeclarationsSummaries || []).filter(d => {
    if (d.fipsCountyCode !== county.fips && d.designatedArea !== 'Statewide') return false;
    if (d.incidentEndDate && Date.parse(d.incidentEndDate) < now - 864e5) return false;   // incident is over
    if (seen[d.femaDeclarationString]) return false;
    return seen[d.femaDeclarationString] = true;
  }).map(d => ({ key: 'fema|' + d.femaDeclarationString, type: d.declarationType, title: d.declarationTitle, date: Date.parse(d.declarationDate) }));
}

// Test notices (from settings, or ?alert=... in the address). They're shown alongside real alerts,
// never instead of them, are tagged "Preview" on screen, and are never written to the alert history.
let liveAlerts = [], liveQuakes = [], liveDecls = [];
function previewNotices() {
  const p = S.alertPreview, now = Date.now(), h = now + 3 * 3600e3;
  const quake = mag => ({ preview: true, quake: true, event: `M${mag.toFixed(1)} Earthquake`, mag, km: 61, start: now - 18 * 60e3, ends: now + 6 * 3600e3,
    level: mag >= 6 ? 'warning' : mag >= 5 ? 'watch' : 'advisory' });
  if (!p) return { alerts: [], quakes: [] };
  if (p === 'earthquake') return { alerts: [], quakes: [quake(6.2)] };
  if (p === 'demo') return {
    alerts: [{ preview: true, event: 'Flash Flood Warning', sev: 'Severe', start: now - 40 * 60e3, ends: h, level: 'warning' },
             { preview: true, event: 'Coastal Flood Advisory', sev: 'Minor', start: now + 5 * 3600e3, ends: h + 9 * 3600e3, level: 'advisory' }],
    quakes: [quake(5.4)] };
  return { alerts: [{ preview: true, event: p, sev: 'Extreme', start: now - 2 * 3600e3, ends: h + 24 * 3600e3,
    level: /Watch/.test(p) ? 'watch' : /Advisory|Statement/.test(p) ? 'advisory' : 'warning' }], quakes: [] };
}
async function refreshAlerts(liveToo = true) {
  if (S.lat == null) return;
  if (liveToo) {
    try { liveAlerts = await loadAlerts(); } catch (e) { /* outside the US or offline: keep what we had until it expires */ }
    try { liveQuakes = await loadQuakes(); } catch (e) {}
    logNotices([
      ...liveAlerts.map(a => ({ key: a.key, kind: 'Weather alert', event: a.event, level: a.level, start: a.start, end: a.ends })),
      ...liveQuakes.map(q => ({ key: q.key, kind: 'Earthquake', event: q.event + ` · ${distTxt(q.km)} away`, level: q.level, start: q.start, end: null })),
    ]);
  }
  const p = previewNotices();
  alerts = [...liveAlerts, ...p.alerts]; quakes = [...liveQuakes, ...p.quakes];
  renderAlert(); applyScene();
}
// New Jersey's own (governor-declared) states of emergency. NJ's website can't be read from a web page,
// so nj-emergency.sh (run by start-display.sh, or by the website build) reads it and writes nj-emergency.js next to this file.
let liveState = [];
function loadNjEmergency() {

    window.NJ_EMERGENCY = undefined;
    const s = document.createElement('script');
    s.src = 'nj-emergency.js?t=' + Date.now();

async function refreshDeclarations(liveToo = true) {
  if (S.lat == null) return;
  if (liveToo) {
    try { liveDecls = await loadDeclarations(); } catch (e) { /* outside the US or offline */ }
    liveState = [];
    if (county && county.state === 'NJ') {
      const nj = await loadNjEmergency();
      if (nj && Date.now() - Date.parse(nj.checked) < 24 * 3600e3)   // ignore if the helper hasn't run in a day
        liveState = nj.active.map(e => ({ key: 'nj|' + e.eo, stateEo: true, state: 'NJ', eo: e.eo, scope: e.scope, reason: e.reason, effective: e.effective, date: Date.parse(e.issued) }));
    }
    logNotices([
      ...liveState.map(d => ({ key: d.key, kind: 'State emergency declaration', event: `${d.state} State of Emergency · ${d.reason || d.scope} · Executive Order ${d.eo}`, level: 'emergency', start: d.date, end: null })),
      ...liveDecls.map(d => ({ key: d.key, kind: 'Emergency declaration', event: `${DECL[d.type] || 'Emergency'} declared: ${titleCase(d.title)}`, level: 'emergency', start: d.date, end: null })),
    ]);
  }
  const test = S.soePreview === 'nj'
    ? [{ preview: true, stateEo: true, state: 'NJ', eo: 99, scope: 'Statewide', reason: 'Winter Storm Demo', effective: '5 p.m. on Saturday, January 24', date: Date.now() - 864e5 }]
    : S.soePreview ? [{ preview: true, type: 'EM', title: 'HURRICANE DEMO', date: Date.now() - 864e5 }] : [];
  decls = [...liveState, ...liveDecls, ...test];   // the state's own declaration comes first
  renderSoe();
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const titleCase = s => String(s).toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
const distTxt = km => imp() ? Math.round(km / 1.609) + ' mi' : Math.round(km) + ' km';
const dayTime = ms => (sameDay(ms, Date.now()) ? '' : fmt(ms, { weekday: 'short' }) + ' ') + fmtTime(ms);
const DECL = { EM: 'Federal emergency', DR: 'Major disaster', FM: 'Fire emergency' };
const ALERT_INK = { warning: '#c41c28', watch: '#ce6810', advisory: '#b0880a' };

function renderAlert() {
  const box = $('#alert'), now = Date.now();
  const list = [...alerts, ...quakes].filter(a => !(a.ends < now)).sort((a, b) => LEVEL[a.level] - LEVEL[b.level]);
  if (!list.length) { box.hidden = true; return; }
  const i = alertIdx % list.length, a = list[i];
  let when;
  if (a.quake) when = [`${distTxt(a.km)} away`, `at ${dayTime(a.start)}`];
  else when = [isNaN(a.start) ? '' : (a.start > now ? 'Starts ' : 'Since ') + dayTime(a.start), isNaN(a.ends) ? '' : 'Until ' + dayTime(a.ends)];
  const tags = [a.preview ? 'Preview' : '', list.length > 1 ? `${i + 1} of ${list.length} alerts` : ''].filter(Boolean);
  const count = tags.length ? `<div class="cnt">${tags.join(' · ')}</div>` : '';
  box.hidden = false;
  box.className = 'alert ' + a.level;
  box.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 2.5 1.5 21h21z" fill="#fff"/><path d="M12 9v5.5" stroke="${ALERT_INK[a.level]}" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="17.6" r="1.4" fill="${ALERT_INK[a.level]}"/></svg>
    <div><div class="ev">${esc(a.event)}</div><div class="when">${when.filter(Boolean).join(' · ')}</div>${count}</div>`;
}

// State of emergency banner under the date and time.
function renderSoe() {
  const el = $('#soe');
  if (!decls.length) { el.hidden = true; return; }
  const d = decls[0], date = new Intl.DateTimeFormat('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' }).format(d.date);
  el.hidden = false;
  const body = d.stateEo
    ? `<b>${d.state} State of Emergency</b> · ${esc([d.reason, d.scope].filter(Boolean).join(' · '))} · Executive Order ${d.eo}${d.effective ? ' · effective ' + esc(d.effective) : ''}`
    : `<b>State of Emergency</b> · ${esc(titleCase(d.title))} · ${DECL[d.type] || 'Emergency'} declared ${date}`;
  el.innerHTML = `<svg viewBox="0 0 24 24"><path d="M5 21V3.5M5 4h12l-2.5 4L17 12H5" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>
    <span>${body}${decls.length > 1 ? ` · +${decls.length - 1} more` : ''}${d.preview ? ' · <em>Preview</em>' : ''}</span>`;
}

// Alert history: every notice shown is kept for 30 days after it was last active, viewable in settings.
const LOG_KEY = 'wt-alertlog', MONTH = 30 * 864e5;
function readLog() {
  try { return JSON.parse(localStorage.getItem(LOG_KEY) || '[]').filter(e => Date.now() - e.seen < MONTH); } catch (e) { return []; }
}
function writeLog(log) { try { localStorage.setItem(LOG_KEY, JSON.stringify(log)); } catch (e) {} }
function logNotices(items) {
  const log = readLog(), now = Date.now();
  for (const it of items) {
    const e = log.find(x => x.key === it.key);
    if (e) Object.assign(e, { end: it.end, seen: now });
    else log.push({ ...it, place: S.name, seen: now });
  }
  writeLog(log);
}
function renderLog() {
  const log = readLog().sort((a, b) => b.start - a.start);
  writeLog(log);   // drops anything older than 30 days
  $('#logCount').textContent = `(${log.length})`;
  const d = ms => isNaN(ms) || ms == null ? '' : fmt(ms, { month: 'short', day: 'numeric' }) + ' ' + fmtTime(ms);
  $('#logList').innerHTML = log.length ? log.map(e => `<div class="logrow"><i class="${e.level}"></i><div>
      <div>${esc(e.event)}</div>
      <div class="m">${esc(e.kind)} · ${d(e.start)}${e.end ? ' – ' + d(e.end) : ''}${e.place ? ' · ' + esc(e.place) : ''}</div></div></div>`).join('')
    : '<div class="m">No alerts in the last 30 days.</div>';
}

async function refreshSea() {

/* ======================= formatting ======================= */
const r0 = v => (v == null || isNaN(v)) ? '--' : Math.round(v);
const fmt = (ms, o) => new Intl.DateTimeFormat('en-US', { timeZone: tz(), ...o }).format(ms);
const fmtTime = ms => fmt(ms, { hour: 'numeric', minute: '2-digit', hour12: S.clock === '12' });
const fmtHour = ms => S.clock === '12' ? fmt(ms, { hour: 'numeric', hour12: true }) : fmt(ms, { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
const localHour = ms => +fmt(ms, { hour: 'numeric', hourCycle: 'h23' });
const sameDay = (a, b) => fmt(a, { dateStyle: 'short' }) === fmt(b, { dateStyle: 'short' });
const lenU = () => imp() ? 'ft' : 'm';
// Expected rain amount, e.g. 0.25″ or 6 mm; blank when it's a trace or less.
const fmtAmt = v => {
  if (v == null || v < (imp() ? .01 : .2)) return '';
  return imp() ? (v < 1 ? v.toFixed(2) : v.toFixed(1)) + '″' : (v < 10 ? v.toFixed(1) : Math.round(v)) + ' mm';
};
// Expected snowfall depth (Open-Meteo gives inches in imperial, cm in metric).
const fmtSnow = v => {
  if (v == null || v < (imp() ? .1 : .2)) return '';
  return imp() ? v.toFixed(1) + '″' : (v < 10 ? v.toFixed(1) : Math.round(v)) + ' cm';
};
const FLAKE = '<svg class="fl" viewBox="0 0 24 24"><path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>';
const amtHtml = (rain, snow) => [fmtAmt(rain), fmtSnow(snow) && `<span class="sn">${fmtSnow(snow)}${FLAKE}</span>`].filter(Boolean).join(' ');
const add = (a, b) => (a || 0) + (b || 0);
const COMPASS = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];

const KIND = c =>
  c <= 1 ? 'clear' : c === 2 ? 'partly' : c === 3 ? 'cloudy' : (c === 45 || c === 48) ? 'fog' :
  (c >= 51 && c <= 57) ? 'drizzle' : (c === 65 || c === 67 || c === 82) ? 'heavy' :
  ((c >= 61 && c <= 66) || (c >= 80 && c <= 81)) ? 'rain' :
  (c === 75 || c === 86) ? 'heavysnow' : c === 73 ? 'snow' : ((c >= 71 && c <= 77) || c === 85) ? 'flurries' :
  c >= 95 ? 'storm' : 'cloudy';
const TEXT = { 0:'Clear', 1:'Mostly Clear', 2:'Partly Cloudy', 3:'Cloudy', 45:'Fog', 48:'Freezing Fog', 51:'Light Drizzle', 53:'Drizzle',
  55:'Heavy Drizzle', 56:'Freezing Drizzle', 57:'Freezing Drizzle', 61:'Light Rain', 63:'Rain', 65:'Heavy Rain', 66:'Freezing Rain',
  67:'Freezing Rain', 71:'Light Snow', 73:'Snow', 75:'Heavy Snow', 77:'Snow Grains', 80:'Rain Showers', 81:'Rain Showers',
  82:'Heavy Showers', 85:'Snow Showers', 86:'Heavy Snow Showers', 95:'Thunderstorms', 96:'Thunderstorms & Hail', 99:'Severe Thunderstorms' };
const condText = (c, day) => day && c === 0 ? 'Sunny' : day && c === 1 ? 'Mostly Sunny' : TEXT[c] || '—';

// Temperature → color for the iPhone-style range bars (works in °F internally).
const TSTOPS = [[10,[122,140,255]],[32,[110,200,250]],[50,[120,225,190]],[65,[240,215,90]],[80,[247,160,75]],[95,[240,90,90]]];
function tempColor(t) {
  const f = imp() ? t : t * 9 / 5 + 32;
  if (f <= TSTOPS[0][0]) return `rgb(${TSTOPS[0][1]})`;
  for (let i = 1; i < TSTOPS.length; i++) {
    const [b, cb] = TSTOPS[i], [a, ca] = TSTOPS[i - 1];
    if (f <= b) { const k = (f - a) / (b - a); return `rgb(${ca.map((v, j) => Math.round(v + (cb[j] - v) * k))})`; }
  }
  return `rgb(${TSTOPS[TSTOPS.length - 1][1]})`;
}

/* ======================= icons ======================= */
const CLOUD = 'M18 46h28a10 10 0 0 0 0-20 14 14 0 0 0-27-3A11 11 0 0 0 18 46z';
const cloud = (fill, tx = 0, ty = 0, s = 1) => `<g transform="translate(${tx} ${ty}) scale(${s})"><path d="${CLOUD}" fill="${fill}"/></g>`;
function sunIc(cx, cy, r) {
  let rays = '';
  for (let a = 0; a < 360; a += 45) {
    const s = a * Math.PI / 180, c = Math.cos(s), n = Math.sin(s);
    rays += `<line x1="${cx + c * (r + 4)}" y1="${cy + n * (r + 4)}" x2="${cx + c * (r + 9)}" y2="${cy + n * (r + 9)}"/>`;
  }
  return `<g stroke="#FFC93C" stroke-width="3.5" stroke-linecap="round">${rays}</g><circle cx="${cx}" cy="${cy}" r="${r}" fill="#FFC93C"/>`;
}
const moonIc = (cx, cy, r) => `<path d="M${cx} ${cy - r}A${r} ${r} 0 0 0 ${cx} ${cy + r}A${r * 1.3} ${r * 1.3} 0 0 1 ${cx} ${cy - r}z" fill="#ECEAF6" transform="translate(${r * .35} 0)"/>`;
const drops = (xs, len, col = '#7cc4ff') => `<g stroke="${col}" stroke-width="3.5" stroke-linecap="round">${xs.map(x => `<line x1="${x}" y1="44" x2="${x - 3}" y2="${44 + len}"/>`).join('')}</g>`;
const flakesIc = (pts, r) => `<g fill="#fff">${pts.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="${r}"/>`).join('')}</g>`;
function icon(code, day = true) {
  let b;
  switch (KIND(code)) {
    case 'clear': b = day ? sunIc(32, 32, 12) : moonIc(30, 32, 15); break;
    case 'partly': b = (day ? sunIc(22, 22, 9) : moonIc(20, 22, 11)) + cloud('#fff', 10, 10, .85); break;
    case 'cloudy': b = cloud('#b9c4d2', -6, -8, .85) + cloud('#fff', 6, 4, .9); break;
    case 'fog': b = cloud('#dfe5ec', 0, -10) + `<g stroke="#dfe5ec" stroke-width="3.5" stroke-linecap="round"><line x1="12" y1="44" x2="52" y2="44"/><line x1="16" y1="51" x2="48" y2="51"/><line x1="12" y1="58" x2="44" y2="58"/></g>`; break;
    case 'drizzle': b = cloud('#e8edf3', 0, -8) + drops([24, 34, 44], 6); break;
    case 'rain': b = cloud('#e8edf3', 0, -8) + drops([22, 32, 42], 12); break;
    case 'heavy': b = cloud('#c3ccd8', 0, -8) + drops([18, 26, 34, 42, 50], 14); break;
    case 'flurries': b = cloud('#f2f5f9', 0, -8) + flakesIc([[24,47],[40,50],[32,58]], 2.6); break;
    case 'snow': b = cloud('#f2f5f9', 0, -8) + flakesIc([[22,46],[32,52],[42,46],[27,59],[38,59]], 2.8); break;
    case 'heavysnow': b = cloud('#c3ccd8', 0, -8) + flakesIc([[17,45],[27,45],[37,45],[47,45],[22,52],[32,52],[42,52],[17,59],[27,59],[37,59],[47,59]], 2.6); break;
    case 'storm': b = cloud('#9aa6b4', 0, -8) + drops([20, 46], 10) + '<polygon points="34,36 25,50 32,50 28,62 41,45 34,45 38,36" fill="#FFD84A"/>'; break;
  }
  return `<svg class="ic" viewBox="0 0 64 64">${b}</svg>`;
}

    for (const c of clouds) { g.globalAlpha = c.a; g.drawImage(c.img, c.x, c.y, c.w, c.h); }
    g.globalAlpha = 1;
    if (swirl) {
      g.strokeStyle = 'rgb(222,230,234)'; g.lineCap = 'round';
      for (const s of streaks) {
        g.globalAlpha = .4 * Math.sin(Math.PI * s.life / s.dur) * Math.min(1, gust);
        g.lineWidth = s.lw; g.beginPath(); g.arc(swirl.x, swirl.y, s.r, s.a, s.a + s.len); g.stroke();
      }
      g.globalAlpha = .75; g.fillStyle = 'rgb(28,30,26)';
      for (const d of debris) g.fillRect(swirl.x + Math.cos(d.a) * d.r, swirl.y + Math.sin(d.a) * d.r, d.s, d.s * .6);
      g.globalAlpha = 1;
    }
    for (const f of flares) { g.fillStyle = f.gr; g.beginPath(); g.arc(f.x, f.y, f.r, 0, 7); g.fill(); }
    if (windLines.length) {   // faint streaks of wind
      g.strokeStyle = 'rgb(255,255,255)'; g.lineWidth = Math.max(1, 1.4 * Hd / 1080); g.lineCap = 'round';
      for (const w of windLines) {
        g.globalAlpha = .22 * Math.sin(Math.PI * w.life / w.dur) * Math.min(1, gust);
        g.beginPath(); g.moveTo(w.x, w.y); g.lineTo(w.x + w.len, w.y); g.stroke();
      }
      g.globalAlpha = 1;
    }
    for (const l of leaves) {   // tumbling leaves: spin, plus a squash on one axis that reads as flipping over
      g.save(); g.globalAlpha = l.a;
      g.translate(l.x, l.y); g.rotate(l.rot); g.scale(Math.cos(l.flip), 1);
      g.drawImage(l.img, -l.size / 2, -l.size / 2, l.size, l.size);

      const img = fogSprite(mode.tod === 'night');
      for (const f of fogs) { g.globalAlpha = f.a; g.drawImage(img, f.x, f.y - 110 * f.s, 900 * f.s, 220 * f.s); }
    }
    g.globalAlpha = 1;
    if (bolt && flashes.length) {
      const fb = flashLevel(ts, 170);   // the bolt lingers a little longer than the sky flash
      if (fb > .01) { g.globalAlpha = fb; g.drawImage(bolt, 0, 0); g.globalAlpha = 1; }
    }
    if (curtains.length) {
      g.setTransform(1, 0, -slant, 1, 0, 0);   // skew so the bands lean with the rain
      for (const c of curtains) { g.globalAlpha = c.a * (.35 + .65 * Math.min(1, gust)); g.drawImage(curtainImg, c.x, 0, c.w, Hd); }
      g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1;

        g.drawImage(img, d.x - pad * s, d.y - (img.height - pad) * s, img.width * s, img.height * s);

      g.fillStyle = 'rgba(255,255,255,.88)'; g.beginPath();
      for (const f of flakes) { g.moveTo(f.x + f.r, f.y); g.arc(f.x, f.y, f.r, 0, 6.283); }
      g.fill();
    }
    if (flashes.length) {
      const f = flashLevel(ts, 110);
      if (f > .01) { g.fillStyle = `rgba(225,232,255,${f * (bolt ? .4 : .25)})`; g.fillRect(0, 0, Wd, Hd); }
    }
  }

  function loop(ts) {
    raf = requestAnimationFrame(loop);
    if (ts - last < 1000 / (S.motion === 'light' ? 15 : 30) - 4) return;
    const dt = Math.min(.1, (ts - last) / 1000); last = ts;

  }

  function setBg(kind, tod) {
    const key = kind + tod;
    if (key === bgKey) return;
    bgKey = key;
    const p = (tod === 'golden' && SKY_COLORS.golden[kind]) || SKY_COLORS[tod === 'night' ? 'night' : 'day'][kind];
    const back = layers[1 - front];
    back.style.background = `linear-gradient(180deg, ${p[0]} 0%, ${p[1]} 55%, ${p[2]} 100%)`;
    back.classList.add('on'); layers[front].classList.remove('on'); front = 1 - front;

  function set(kind, tod) {
    setBg(kind, tod);
    const s = [kind, tod, Wd, Hd, S.motion].join('|');

  }
  function resize() {

function isDayNow() {
  if (!W) return true;
  const now = Date.now() / 1000, d = W.daily;
  for (let i = 0; i < d.time.length; i++) if (now >= d.sunrise[i] && now < d.sunset[i]) return true;
  return d.sunrise[0] ? false : !!W.current.is_day;   // polar day/night: trust the API flag
}

// Hurricane scene: an active hurricane/typhoon/tropical storm warning, or (anywhere) hurricane-force gusts.
function hurricaneNow() {
  const now = Date.now();
  if (alerts.some(a => !(a.ends < now) && /Hurricane Warning|Typhoon Warning|Tropical Storm Warning|Hurricane Force Wind Warning/.test(a.event))) return true;
  return !!W && W.current.wind_gusts_10m >= (imp() ? 74 : 119);
}

// Windy scene: a High Wind Warning, or strong wind in the current conditions.
function windyNow() {
  const now = Date.now();
  if (alerts.some(a => !(a.ends < now) && /High Wind|Extreme Wind/.test(a.event))) return true;
  if (!W) return false;
  const c = W.current;
  return c.wind_gusts_10m >= (imp() ? 40 : 64) || c.wind_speed_10m >= (imp() ? 25 : 40);
}

function applyScene() {
  let kind = S.scene !== 'auto' ? S.scene : W ? KIND(W.current.weather_code) : 'clear';
  if (S.scene === 'auto') {
    if (hurricaneNow()) kind = 'hurricane';
    else if (windyNow() && ['clear', 'partly', 'cloudy', 'fog'].includes(kind)) kind = 'windy';   // rain/snow scenes win over wind
  }
  let tod = S.tod;
  if (tod === 'auto') {
    if (!W) { const h = new Date().getHours(); tod = h >= 7 && h < 19 ? 'day' : 'night'; }
    else {
      const now = Date.now() / 1000, d = W.daily;
      const near = [...d.sunrise, ...d.sunset].some(t => t && Math.abs(now - t) < 45 * 60);
      tod = near && (kind === 'clear' || kind === 'partly') ? 'golden' : isDayNow() ? 'day' : 'night';
    }
  }
  Sky.set(kind, tod);
}

    return `<div class="day"><div>${i === 0 ? 'Today' : fmt((t + 43200) * 1000, { weekday: 'short' })}</div>${icon(d.weather_code[i])}
      <div class="p">${p >= 20 ? p + '%' : ''}${(a => a ? `<small>${a}</small>` : '')(amtHtml(add(d.rain_sum[i], d.showers_sum[i]), d.snowfall_sum[i]))}</div><div class="lo">${r0(a)}°</div>
      <div class="bar"><i style="left:${(a - lo) / span * 100}%;right:${(hi - b) / span * 100}%;background:linear-gradient(90deg,${tempColor(a)},${tempColor(b)})"></i>${dot}</div>
      <div>${r0(b)}°</div></div>`;
  }).join('');

  // stat tiles
  const nextOf = arr => (arr.find(t => t > nowS) || arr[0]) * 1000;
  const uv = d.uv_index_max[0], uvL = uv < 3 ? 'Low' : uv < 6 ? 'Moderate' : uv < 8 ? 'High' : uv < 11 ? 'Very high' : 'Extreme';
  const tiles = [
    ['Feels like', r0(c.apparent_temperature) + '°'],
    ['Humidity', r0(c.relative_humidity_2m) + '%'],
    ['Wind', `<span class="arrow" style="transform:rotate(${c.wind_direction_10m + 180}deg)">↑</span> ${r0(c.wind_speed_10m)}`,
      `${COMPASS[Math.round(c.wind_direction_10m / 22.5) % 16]} · gusts ${r0(c.wind_gusts_10m)} ${imp() ? 'mph' : 'km/h'}`],

  const mi = M ? M.hourly.time.findIndex(t => t + 3600 > nowS) : -1;
  const sst = mi >= 0 ? M.hourly.sea_surface_temperature[mi] : null, wave = mi >= 0 ? M.hourly.wave_height[mi] : null;
  if (sst != null) tiles.push(['Water temp', r0(imp() ? sst * 9 / 5 + 32 : sst) + '°']);
  else tiles.push(['Pressure', imp() ? (c.pressure_msl * 0.02953).toFixed(2) : r0(c.pressure_msl), imp() ? 'inHg' : 'hPa']);

  else tiles.push(['Rain chance', r0(d.precipitation_probability_max[0]) + '%', 'today']);
  $('#stats').innerHTML = tiles.map(([k, v, s]) => `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div>${s ? `<div class="s">${s}</div>` : ''}</div>`).join('');

  renderTide();
}

function smoothPath(p) {
  let s = `M${p[0][0].toFixed(1)},${p[0][1].toFixed(1)}`;
  for (let i = 0; i < p.length - 1; i++) {
    const a = p[i - 1] || p[i], b = p[i], c = p[i + 1], e = p[i + 2] || c;
    s += `C${(b[0] + (c[0] - a[0]) / 6).toFixed(1)},${(b[1] + (c[1] - a[1]) / 6).toFixed(1)} ${(c[0] - (e[0] - b[0]) / 6).toFixed(1)},${(c[1] - (e[1] - b[1]) / 6).toFixed(1)} ${c[0].toFixed(1)},${c[1].toFixed(1)}`;
  }
  return s;
}

function renderTide() {
  const body = $('#tideBody');
  $('#tideSrc').textContent = T ? T.source : '';
  const now = Date.now(), t0 = now - 6 * 3600e3, t1 = now + 24 * 3600e3;
  const pts = T ? T.pts.filter(p => p.t >= t0 - 3600e3 && p.t <= t1 + 3600e3) : [];
  if (pts.length < 4) { body.innerHTML = `<div class="empty">${S.lat == null ? '' : tideMsg}</div>`; return; }

  const u = lenU(), fv = v => v.toFixed(1) + ' ' + u;
  let vNow = pts[0].v;
  for (let i = 0; i < pts.length - 1; i++) if (pts[i].t <= now && pts[i + 1].t > now) { const a = pts[i], b = pts[i + 1]; vNow = a.v + (b.v - a.v) * (now - a.t) / (b.t - a.t); }
  const upcoming = T.ext.filter(e => e.t > now);
  const next = upcoming[0];
  const rising = next ? next.type === 'high' : false;
  const inMin = next ? Math.round((next.t - now) / 60e3) : 0;
  const inTxt = next ? (inMin >= 60 ? `${Math.floor(inMin / 60)}h ${inMin % 60}m` : `${inMin}m`) : '';

  body.innerHTML = `
    <div class="tide-sum"><b>${rising ? '▲ Rising' : '▼ Falling'}</b> <span class="dim">· ${fv(vNow)} now</span>
      ${next ? `<span class="dim">· ${next.type === 'high' ? 'High' : 'Low'} tide in</span> <b>${inTxt}</b>` : ''}</div>
    <div class="chart"><svg id="tideSvg"></svg></div>
    <div class="tide-marks" id="tideMarks"></div>`;

  const svg = $('#tideSvg'), w = svg.clientWidth, hgt = svg.clientHeight;
  if (!w || !hgt) return;
  const rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
  const padT = rem * .9, padB = rem * .9;
  const vs = pts.map(p => p.v), lo = Math.min(...vs), hi = Math.max(...vs), rng = (hi - lo) || 1;
  const X = t => (t - t0) / (t1 - t0) * w, Y = v => padT + (1 - (v - lo) / rng) * (hgt - padT - padB);
  const xy = pts.map(p => [X(p.t), Y(p.v)]);
  const line = smoothPath(xy), base = hgt - padB + rem * .4;

  let ticks = '';
  for (let t = Math.ceil(t0 / 3600e3) * 3600e3; t <= t1; t += 3600e3) {
    if (localHour(t) % 6) continue;
    ticks += `<line x1="${X(t)}" y1="${padT * .5}" x2="${X(t)}" y2="${base}" stroke="rgba(255,255,255,.08)"/>`;
  }
  // Each high/low gets a dot on the curve with a dotted line down to its time and height underneath the chart.
  const ext = T.ext.filter(e => e.t > t0 && e.t < t1);
  const labels = ext.map(e => {
    const x = X(e.t), y = Y(e.v), op = e.t < now ? .45 : 1;
    return `<line x1="${x}" y1="${y + rem * .3}" x2="${x}" y2="${hgt}" stroke="rgba(255,255,255,${.35 * op})" stroke-dasharray="2 4"/>
      <circle cx="${x}" cy="${y}" r="${rem * .22}" fill="#fff" opacity="${op}"/>`;
  }).join('');
  $('#tideMarks').innerHTML = ext.map(e => {
    const x = Math.min(Math.max(X(e.t), rem * 2.6), w - rem * 2.6);   // keep edge labels on screen
    const day = sameDay(e.t, now) ? '' : ' · ' + fmt(e.t, { weekday: 'short' });
    return `<div class="mk${e.t < now ? ' past' : ''}" style="left:${x}px">${e.type === 'high' ? 'High' : 'Low'}${day}<strong>${fmtTime(e.t)}</strong>${fv(e.v)}</div>`;
  }).join('');
  const nx = X(now), ny = Y(vNow);
  svg.setAttribute('viewBox', `0 0 ${w} ${hgt}`);
  svg.innerHTML = `
    <defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6cc4ff" stop-opacity=".55"/><stop offset="1" stop-color="#6cc4ff" stop-opacity=".04"/></linearGradient></defs>
    ${ticks}
    <path d="${line}L${xy[xy.length - 1][0]},${base}L${xy[0][0]},${base}Z" fill="url(#tg)"/>
    <path d="${line}" fill="none" stroke="#8fd3ff" stroke-width="${rem * .14}"/>
    <rect x="0" y="0" width="${Math.max(0, nx)}" height="${base}" fill="rgba(4,8,16,.28)"/>
    <line x1="${nx}" y1="${padT * .3}" x2="${nx}" y2="${base}" stroke="rgba(255,255,255,.6)" stroke-dasharray="3 4"/>
    ${labels}
    <circle cx="${nx}" cy="${ny}" r="${rem * .55}" fill="rgba(143,211,255,.3)"/>
    <circle cx="${nx}" cy="${ny}" r="${rem * .3}" fill="#fff"/>`;
}

let pick = null, searchSeq = 0, searchT = 0;
const box = $('#locResults');

function openSettings(msg) {
  pick = null;
  $('#locInput').value = S.name;
  $('#unitsSel').value = S.units; $('#clockSel').value = S.clock; $('#stationInput').value = S.tideStation;
  $('#motionSel').value = S.motion; $('#sceneSel').value = S.scene; $('#todSel').value = S.tod;

  $('#settings').hidden = false;
  setTimeout(() => { $('#locInput').focus(); $('#locInput').select(); }, 50);
}
const closeSettings = () => { $('#settings').hidden = true; };

async function search(q) {
  q = q.trim();
  const seq = ++searchSeq;
  const m = q.match(/^(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)$/);
  if (m) { const res = [{ name: `${(+m[1]).toFixed(3)}, ${(+m[2]).toFixed(3)}`, lat: +m[1], lon: +m[2] }]; showResults(res); return res; }
  if (q.length < 2) { box.innerHTML = ''; return []; }
  box.innerHTML = '<div class="msg">Searching…</div>';
  try {
    const j = await getJSON('https://geocoding-api.open-meteo.com/v1/search?' + qs({ name: q, count: 8, language: 'en', format: 'json' }));
    if (seq !== searchSeq) return [];
    const res = (j.results || []).map(x => ({
      name: [x.name, x.admin1 !== x.name ? x.admin1 : '', x.country_code === 'US' ? '' : x.country].filter(Boolean).join(', '),
      lat: x.latitude, lon: x.longitude,
    }));
    showResults(res);
    return res;
  } catch (e) {
    if (seq === searchSeq) box.innerHTML = '<div class="msg">Search failed — check the internet connection.</div>';
    return [];
  }
}
function showResults(res) {
  box.innerHTML = res.length ? '' : '<div class="msg">No places found. Try a nearby town, or enter lat,lon.</div>';
  res.forEach(r => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = r.name;
    b.onclick = () => choose(r);
    box.appendChild(b);
  });
}
function choose(r) {
  pick = r; $('#locInput').value = r.name;
  box.innerHTML = `<div class="picked">✓ ${r.name} — press Save</div>`;
  ++searchSeq;
}

$('#locInput').addEventListener('input', e => { pick = null; clearTimeout(searchT); searchT = setTimeout(() => search(e.target.value), 450); });
$('#locInput').addEventListener('keydown', async e => {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  if (pick) { $('#setForm').requestSubmit(); return; }
  clearTimeout(searchT);
  const res = await search(e.target.value);
  if (res[0]) choose(res[0]);
});
$('#cancelBtn').onclick = closeSettings;
$('#gear').onclick = () => openSettings();

  e.preventDefault();
  const prev = { ...S };
  if (pick) { S.name = pick.name; S.lat = pick.lat; S.lon = pick.lon; }
  if (S.lat == null) { toast('Search for a location and pick one first'); return; }
  S.units = $('#unitsSel').value; S.clock = $('#clockSel').value; S.tideStation = $('#stationInput').value.trim();
  S.motion = $('#motionSel').value; S.scene = $('#sceneSel').value; S.tod = $('#todSel').value;
  S.alertPreview = $('#alertSel').value; S.soePreview = $('#soeSel').value;
  saveSettings(); closeSettings();
  // Settings are now the source of truth: drop preview options from the address so a reload can't bring them back.
  if (location.search) try { history.replaceState(null, '', location.pathname); } catch (e) {}
  const moved = prev.lat !== S.lat || prev.lon !== S.lon, units = prev.units !== S.units;
  if (moved) {
    W = M = T = null; liveAlerts = []; liveQuakes = []; liveDecls = []; county = null; tideMsg = 'Loading tides…';
    refreshAlerts(); refreshDeclarations();
  } else {
    if (prev.alertPreview !== S.alertPreview) refreshAlerts(false);
    if (prev.soePreview !== S.soePreview) refreshDeclarations(false);
  }
  if (moved || units) refreshWeather();
  if (moved || units || prev.tideStation !== S.tideStation) refreshSea();
  tick(); render(); applyScene();
});

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2500);
}

addEventListener('keydown', e => {
  if (!$('#settings').hidden) { if (e.key === 'Escape') closeSettings(); return; }
  const k = e.key.toLowerCase();
  if (k === 's' || k === 'm' || e.key === 'Enter' || e.key === 'ContextMenu') { e.preventDefault(); openSettings(); }
  else if (k === 'f') toggleFullscreen();
  else if (k === 'r') { toast('Refreshing…'); refreshWeather(); refreshSea(); refreshAlerts(); refreshDeclarations(); }
});

// Hide the cursor and settings button when the mouse is idle.
let idleT = 0;
function wake() { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add('idle'), 3000); }
['mousemove', 'mousedown', 'touchstart'].forEach(ev => addEventListener(ev, wake, { passive: true }));

/* ======================= start ======================= */
let resizeT = 0;
addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { Sky.resize(); render(); }, 200); });

Sky.resize();
applyScene();
tick(); render(); wake();
setInterval(tick, 1000);
setInterval(() => { render(); applyScene(); }, 60e3);           // move the tide "now" marker, roll hours, catch sunset
setInterval(refreshWeather, 10 * 60e3);
setInterval(refreshSea, 60 * 60e3);
setInterval(refreshAlerts, 2 * 60e3);
setInterval(refreshDeclarations, 30 * 60e3);
setInterval(() => { alertIdx++; renderAlert(); }, 8000);   // rotate when there's more than one alert
// Nudge the layout a few pixels every few minutes so nothing sits on the same pixels forever.
setInterval(() => { $('#app').style.transform = `translate(${rnd(-6, 6).toFixed(1)}px, ${rnd(-5, 5).toFixed(1)}px)`; }, 5 * 60e3);

if (S.lat == null) openSettings('Welcome! Type your town or ZIP code, pick it from the list, then press Save.');
else { refreshWeather(); refreshSea(); refreshAlerts(); refreshDeclarations(); }
</script>
</body>
</html>
