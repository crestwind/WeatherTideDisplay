# Publishes the display as a website on GitHub Pages.
# Runs on every push, and every 30 minutes so New Jersey's state-of-emergency status stays current
# (nj.gov can't be read from a web page, so nj-emergency.sh reads it here and the page loads the result).
name: Publish website

on:
  push:
    branches: [main]
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write   # only for the keep-alive commit below
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    # The same files also go to the test site (crestwind/tidal-weather-test), which only publishes when pushed to
    if: github.event_name != 'schedule' || github.repository == 'crestwind/WeatherTideDisplay'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Build the site
        run: |
          # The script files share one set of names: the same top-level name in two files makes the later one replace
          # the earlier (a function) or stops the page loading (a const or let). Refuse to publish if that happens.
          dups=$(grep -ohE "^(async )?function [A-Za-z0-9_]+|^(const|let|var) [A-Za-z0-9_]+" fisherman-lines.js camper-lines.js beach-lines.js js/*.js | awk '{print $NF}' | sort | uniq -d)
          if [ -n "$dups" ]; then echo "The same name is used in two script files: $dups"; exit 1; fi
          mkdir _site
          cp index.html privacy.html accessibility.html style.css icon.png icon.ico logo.png banner.txt sounds.json fisherman-lines.js camper-lines.js beach-lines.js manifest.webmanifest app-icon-180.png app-icon-192.png app-icon-512.png nj-emergency.sh _site/
          cp -r js _site/
          # tag the page's own files with this commit, so a browser never mixes a new page with old cached scripts
          V=$(git rev-parse --short HEAD)
          sed -i "s#src=\"js/\([a-z-]*\)\.js\"#src=\"js/\1.js?v=$V\"#; s#href=\"style.css\"#href=\"style.css?v=$V\"#" _site/index.html
          grep -q "style.css?v=$V" _site/index.html && grep -q "js/start.js?v=$V" _site/index.html
          mkdir -p _site/sounds && cp sounds/*.mp3 sounds/*.m4a sounds/*.ogg sounds/*.wav _site/sounds/ 2>/dev/null || true   # ambient sounds, once added
          echo "window.APP_VERSION = { built: \"$(git log -1 --format=%cs)\" };" > _site/version.js
          # If nj.gov is down, publish without it; the page simply skips the NJ check
          sh _site/nj-emergency.sh || echo "NJ check failed; publishing without it"
          rm _site/nj-emergency.sh

      - name: Mark the test site
        if: github.repository != 'crestwind/WeatherTideDisplay'
        run: |
          # keep it out of search engines, switch on showcase mode (random events back to back), and show a small tag at the top
          sed -i 's|<title>|<meta name="robots" content="noindex, nofollow">\n<script>window.TW_SHOWCASE = true;</script>\n<title>|' _site/index.html
          sed -i 's|</body>|<div style="position:fixed;left:50%;top:0;transform:translateX(-50%);z-index:99;background:#c0392b;color:#fff;font:600 12px sans-serif;letter-spacing:.08em;padding:2px 12px;border-radius:0 0 6px 6px">TEST SITE · SHOWCASE</div>\n</body>|' _site/index.html
          for p in privacy accessibility; do sed -i 's|<title>|<meta name="robots" content="noindex, nofollow">\n<title>|' _site/$p.html; done
          grep -q 'name="robots"' _site/privacy.html && grep -q 'name="robots"' _site/accessibility.html && grep -q 'name="robots"' _site/index.html && grep -q 'TW_SHOWCASE = true' _site/index.html && grep -q 'TEST SITE' _site/index.html

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5

      # GitHub pauses scheduled runs after 60 days without a commit, so add an empty one every 45 days
      - name: Keep the schedule alive
        if: github.event_name == 'schedule' && github.repository == 'crestwind/WeatherTideDisplay'
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep scheduled updates running"
            git push
          fi
