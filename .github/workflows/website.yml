# Publishes the display as a website on GitHub Pages.
# Runs on every push, and every 30 minutes so New Jersey's state-of-emergency status stays current
# (nj.gov can't be read from a web page, so nj-emergency.sh reads it here and the page loads the result).
name: Publish website

on:
  push:
    branches: [main]
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write   # only for the keep-alive commit below
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    # The same files also go to the test site (crestwind/tidal-weather-test), which only publishes when pushed to
    if: github.event_name != 'schedule' || github.repository == 'crestwind/WeatherTideDisplay'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build the site
        run: |
          mkdir _site
          cp index.html icon.png icon.ico logo.png banner.txt sounds.json manifest.webmanifest app-icon-180.png app-icon-192.png app-icon-512.png nj-emergency.sh _site/
          mkdir -p _site/sounds && cp sounds/*.mp3 sounds/*.m4a sounds/*.ogg sounds/*.wav _site/sounds/ 2>/dev/null || true   # ambient sounds, once added
          echo "window.APP_VERSION = { built: \"$(git log -1 --format=%cs)\" };" > _site/version.js
          # If nj.gov is down, publish without it; the page simply skips the NJ check
          sh _site/nj-emergency.sh || echo "NJ check failed; publishing without it"
          rm _site/nj-emergency.sh

      - name: Mark the test site
        if: github.repository != 'crestwind/WeatherTideDisplay'
        run: |
          # keep it out of search engines, and show a small TEST SITE tag at the top
          sed -i 's|<title>|<meta name="robots" content="noindex, nofollow">\n<title>|' _site/index.html
          sed -i 's|</body>|<div style="position:fixed;left:50%;top:0;transform:translateX(-50%);z-index:99;background:#c0392b;color:#fff;font:600 12px sans-serif;letter-spacing:.08em;padding:2px 12px;border-radius:0 0 6px 6px">TEST SITE</div>\n</body>|' _site/index.html
          grep -q 'name="robots"' _site/index.html && grep -q 'TEST SITE' _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

      # GitHub pauses scheduled runs after 60 days without a commit, so add an empty one every 45 days
      - name: Keep the schedule alive
        if: github.event_name == 'schedule' && github.repository == 'crestwind/WeatherTideDisplay'
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep scheduled updates running"
            git push
          fi
